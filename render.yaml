services:
  - type: web
    name: amazon-ads-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: USE_MOCK
        value: "false"
      - key: ACOS_TARGET
        value: "0.40"
      - key: DAILY_BUDGET_MAX
        value: "30.00"
      - key: AMAZON_CLIENT_ID
        sync: false
      - key: AMAZON_CLIENT_SECRET
        sync: false
      - key: AMAZON_REFRESH_TOKEN
        sync: false
      - key: AMAZON_PROFILE_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
